      <h1 class="text-2xl font-bold tracking-wider text-amber-400">✨ 口袋塔羅 · 78張完整版</h1>
      <p class="text-xs text-slate-400 mt-1">靜心默念，讓牌面映照內心真實能量</p>
    </header>

    <!-- 問題輸入區 -->
    <div class="w-full bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg mb-4">
      <label class="block text-xs text-amber-300 font-medium mb-1">心裡默念或輸入你的問題：</label>
      <input id="user-question" type="text" placeholder="例如：這段關係接下來的發展如何？該如何面對？" 
             class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
      
      <!-- 牌陣按鈕組 -->
      <div class="grid grid-cols-3 gap-2 mt-3">
        <button onclick="startSpread('single')" class="py-2 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 rounded-lg text-xs md:text-sm font-semibold transition">
          單張指引
        </button>
        <button onclick="startSpread('three')" class="py-2 bg-indigo-700 hover:bg-indigo-600 text-white rounded-lg text-xs md:text-sm font-semibold transition">
          三張時間流
        </button>
        <button onclick="startSpread('five')" class="py-2 bg-purple-700 hover:bg-purple-600 text-amber-200 rounded-lg text-xs md:text-sm font-semibold transition shadow-md">
          五牌大十字陣
        </button>
      </div>
    </div>

    <!-- 牌卡展示區 -->
    <div id="cards-display" class="w-full mb-6"></div>

        <span>🔮</span> 占卜師深度解析
      </h3>

        正在連線直覺能量，為您深度抽絲剝繭...
      </div>
      <div id="ai-content" class="text-sm text-slate-300 whitespace-pre-line leading-relaxed hidden"></div>
    </div>
  </div>

    function createCardElement(c, label) {
      const cardBox = document.createElement('div');
      cardBox.className = 'flex flex-col items-center flex-1 min-w-[90px] max-w-[120px]';
      cardBox.innerHTML = `
        <span class="text-[11px] text-amber-300 mb-1 font-semibold text-center line-clamp-1">${label}</span>
        <div class="w-full aspect-[2/3] bg-slate-900 border border-slate-700 rounded-lg overflow-hidden shadow-md">
          <img src="${c.image}" alt="${c.name}" class="w-full h-full object-cover transition duration-300 ${c.isReversed ? 'rotate-180' : ''}">
        </div>
        <span class="text-xs text-slate-200 mt-1 font-medium text-center line-clamp-1">${c.name.split(' ')[0]}</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded ${c.isReversed ? 'bg-rose-950 text-rose-300 border border-rose-800/40' : 'bg-emerald-950 text-emerald-300 border border-emerald-800/40'} mt-0.5 font-bold">
          ${c.isReversed ? '逆位' : '正位'}
        </span>
      `;
      return cardBox;
    }

    async function startSpread(type) {
      let count = 1;
      let positionLabels = ['核心指引'];

      if (type === 'three') {
        count = 3;
        positionLabels = ['過去 / 根源', '現在 / 現狀', '未來 / 指引'];
      } else if (type === 'five') {
        count = 5;
        positionLabels = ['1. 現狀核心', '2. 障礙挑戰', '3. 潛在過去', '4. 近期未來', '5. 最終指引'];
      }

      const question = document.getElementById('user-question').value.trim();
      const display = document.getElementById('cards-display');
      display.innerHTML = '';

      // 78 張隨機洗牌
      const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, count).map(card => ({
        ...card,
        isReversed: Math.random() < 0.5
      }));

      // 排版呈現：五牌陣使用響應式彈性排版
      const cardContainer = document.createElement('div');
      cardContainer.className = 'w-full flex flex-wrap justify-center gap-2 md:gap-3';
      selected.forEach((c, idx) => {
        cardContainer.appendChild(createCardElement(c, positionLabels[idx]));
      });
      display.appendChild(cardContainer);

      // 呼叫後端 Gemini
      const aiSection = document.getElementById('ai-section');
      const aiLoading = document.getElementById('ai-loading');
      const aiContent = document.getElementById('ai-content');

      aiSection.classList.remove('hidden');
      aiLoading.classList.remove('hidden');
      aiContent.classList.add('hidden');
      aiContent.innerText = '';

      try {
        const res = await fetch('/api/interpret', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, spreadType: type, cards: selected })
        });
        const data = await res.json();

        aiLoading.classList.add('hidden');
        aiContent.classList.remove('hidden');
        aiContent.innerText = data.interpretation || '解讀失敗，請重試。';
      } catch (err) {
        aiLoading.classList.add('hidden');
        aiContent.classList.remove('hidden');
        aiContent.innerText = '連線伺服器時發生問題，請稍候再試。';
      }
    }
